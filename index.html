<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alpha_Tracker</title>
    <meta name="description" content="Crypto Airdrop Hunter Dashboard - Track and manage your airdrop campaigns" />

    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="manifest" href="/manifest.json" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Sora:wght@500;600;700;800&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">

    <script>
      (function() {
        const saved = localStorage.getItem('alpha-tracker-theme') ||
          localStorage.getItem('alpha_tracker_theme') ||
          localStorage.getItem('alpha_trecker_theme') ||
          'obsidian';
        const parsed = { dark: 'obsidian', light: 'slate', ocean: 'slate', sunset: 'deep-navy', obsidian: 'obsidian', slate: 'slate', graphite: 'graphite', 'deep-navy': 'deep-navy' }[saved] || 'obsidian';
        document.documentElement.dataset.theme = parsed;
        document.documentElement.classList.remove('dark', 'light', 'ocean', 'sunset', 'obsidian', 'slate', 'graphite', 'deep-navy');
        document.documentElement.classList.add(parsed);
        document.documentElement.style.colorScheme = 'dark';
      })();
    </script>

    <style>
      html { background: #0d0f12; }
      body { margin: 0; min-height: 100vh; }
      #root { min-height: 100vh; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
